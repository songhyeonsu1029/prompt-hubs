
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: prompthubs-backend:demo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET}
      TOKEN_ENCRYPTION_SALT: ${TOKEN_ENCRYPTION_SALT}

      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_FRONTEND_CALLBACK_URL: ${GOOGLE_OAUTH_FRONTEND_CALLBACK_URL:-}
      GOOGLE_OAUTH_FRONTEND_LOGIN_URL: ${GOOGLE_OAUTH_FRONTEND_LOGIN_URL:-}

      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    ports:
      # CloudFront origin이 EC2 8080으로 직접 접근하므로 모든 인터페이스에 바인딩.
      # 외부 노출은 EC2 SG의 CloudFront prefix list 제한으로 통제한다.
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
