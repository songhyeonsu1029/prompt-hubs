spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/prompthubs
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:true}
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:prompt-hubs-jwt-secret-key-for-development-at-least-256-bits-long}
  access-expiration: 1800000   # 30분
  refresh-expiration: 1209600000  # 14일

oauth:
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
    scope: openid email profile
    frontend-callback-url: ${GOOGLE_OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth/callback}
    frontend-login-url: ${GOOGLE_OAUTH_FRONTEND_LOGIN_URL:http://localhost:5173/login}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Phase 2: External integrations
integrations:
  notion:
    enabled: ${NOTION_ENABLED:false}
    client-id: ${NOTION_CLIENT_ID:}
    client-secret: ${NOTION_CLIENT_SECRET:}
    redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/api/v1/integrations/notion/callback}
    api-base: https://api.notion.com/v1
    api-version: "2022-06-28"
    poll-interval-seconds: 60
    parent-page-id: ${NOTION_PARENT_PAGE_ID:}
  slack:
    enabled: ${SLACK_ENABLED:false}
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    signing-secret: ${SLACK_SIGNING_SECRET:}
    redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/v1/integrations/slack/callback}
    bot-scope: chat:write,commands,channels:read,groups:read,users:read
  mcp:
    enabled: true
    api-key-prefix: ph_

token-encryption:
  secret: ${TOKEN_ENCRYPTION_SECRET:dev-token-encryption-secret-change-in-production-32bytes}
  salt: ${TOKEN_ENCRYPTION_SALT:5c0744940b5c369b}
